<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 0 216 92" width="240" height="102" role="img" aria-label="Inline">
  <title>Inline</title>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 64px;
      font-weight: 700;
      fill: #111;
    }
    .mid text { fill: #6d5bd0; }
    .mid { opacity: 0; }

    /* 两边对称分开:In 左移 17,ne 右移 18,中间让出 35 —— 正好放下 li。
       定位用 x 属性,动画用 CSS transform,两者不会互相覆盖。 */
    /* 整段:先淡入(Inne),分开成 Inline,再淡出,然后从头开始。
       这样"合回去"这一步就藏在不可见的时候,看不到回弹 */
    .word  { animation: fade 5s ease-in-out infinite; }
    .left  { animation: goLeft  5s ease-in-out infinite; }
    .right { animation: goRight 5s ease-in-out infinite; }
    .mid   { animation: appear  5s ease-in-out infinite; }

    @keyframes fade {
      0%        { opacity: 0; }
      8%, 82%   { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
    @keyframes goLeft {
      0%, 20%   { transform: translateX(0); }
      42%, 100% { transform: translateX(-17px); }
    }
    @keyframes goRight {
      0%, 20%   { transform: translateX(0); }
      42%, 100% { transform: translateX(18px); }
    }
    @keyframes appear {
      0%, 28%   { opacity: 0; transform: translateY(7px); }
      46%, 100% { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .left, .right, .mid, .word { animation: none; }
      .word { opacity: 1; }
      .left  { transform: translateX(-17px); }
      .right { transform: translateX(18px); }
      .mid   { opacity: 1; transform: none; }
    }
  </style>

  <g class="word">
  <g transform="translate(20, 0)">
    <g class="left"><text x="0" y="72">In</text></g>
    <g class="mid"><text x="44" y="72">li</text></g>
    <g class="right"><text x="61" y="72">ne</text></g>
  </g>
  </g>
</svg>
