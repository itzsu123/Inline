  <text class="mark" x="450" y="140" text-anchor="middle">In<tspan class="accent">li</tspan>ne</text>
  <text class="tag" x="450" y="212" text-anchor="middle">答案应该长在<tspan class="accent">提问的地方</tspan>，而不是别的地方。</text>
